name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
      build_run:
        description: Successful Windows 64-bit workflow run ID
        type: string
      attach_arm64:
        description: Add the ARM64 executable and its source archive to an existing published release
        type: boolean
        default: false
      attach_x64_source:
        description: Add a named source archive from the existing x64 release tag
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ !inputs.attach_x64_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
      BUILD_RUN: ${{ inputs.build_run }}
      ATTACH_ARM64: ${{ inputs.attach_arm64 }}
    steps:
      - if: inputs.attach_arm64
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release and build
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD_RUN" =~ ^[0-9]+$ ]]
          build_sha="$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,event,workflowName \
            --jq 'select(.conclusion == "success" and .workflowName == "Windows 64-bit" and
              .headBranch == "main" and (.event == "push" or .event == "workflow_dispatch")) | .headSha')"
          [[ -n "$build_sha" ]]
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          if [[ "$ATTACH_ARM64" == true ]]; then
            [[ "$(jq -r .isDraft <<<"$release")" == false ]]
            git merge-base --is-ancestor "$build_sha" "$GITHUB_SHA"
            git diff --exit-code "$RELEASE_TAG" "$build_sha" -- src third_party \
              ':!src/notfar.manifest' ':!src/notfar.rc'
            printf 'ARM64_SOURCE_SHA=%s\n' "$build_sha" >> "$GITHUB_ENV"
          else
            [[ "$(jq -r 'select(.isDraft) | .targetCommitish' <<<"$release")" == "$build_sha" ]]
          fi
      - if: ${{ !inputs.attach_arm64 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: NotFar-Manager-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: NotFar-Manager-arm64
          path: dist
      - name: Attach and publish
        if: ${{ !inputs.attach_arm64 }}
        run: |
          gh release upload "$RELEASE_TAG" dist/NotFar-Manager-x64.exe dist/NotFar-Manager-ARM64.exe --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Attach ARM64 and its source to the published release
        if: inputs.attach_arm64
        run: |
          exe=dist/NotFar-Manager-ARM64.exe
          published_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "NotFar-Manager-ARM64.exe") | .digest')"
          if [[ -z "$published_digest" ]]; then
            gh release upload "$RELEASE_TAG" "$exe#Windows ARM64" --repo "$GITHUB_REPOSITORY"
          else
            exe_hash="$(sha256sum "$exe" | cut -d' ' -f1)"
            [[ "$published_digest" == "sha256:$exe_hash" ]]
          fi
          archive_name="NotFar-Manager-${RELEASE_TAG}-ARM64-source"
          git archive --format=zip --prefix="$archive_name/" \
            -o "dist/$archive_name.zip" "$ARM64_SOURCE_SHA"
          gh release upload "$RELEASE_TAG" "dist/$archive_name.zip#Windows ARM64 source" --repo "$GITHUB_REPOSITORY"
  publish_x64_source:
    if: inputs.attach_x64_source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attach x64 source from the release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          jq -e '.isDraft == false and any(.assets[]; .name == "NotFar-Manager-x64.exe")' <<<"$release"
          tag="refs/tags/$RELEASE_TAG"
          name="NotFar-Manager-$RELEASE_TAG-x64-source"
          extra=()
          if ! git cat-file -e "$tag:LICENSE" 2>/dev/null; then
            extra+=(--add-file=LICENSE)
          fi
          git archive --format=zip --prefix="$name/" "${extra[@]}" -o "$name.zip" "$tag"
          gh release upload "$RELEASE_TAG" "$name.zip" --repo "$GITHUB_REPOSITORY"
